<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
        }

        .logo-animation {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-animation h1 {
            font-size: 2.5em;
            color: var(--primary-color);
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="logo-animation">
                <h1>💰 WealthWise AI</h1>
                <p class="tagline">Emphasizes Intelligent Financial Decisions</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="loginTab" type="button">Login</button>
                <button class="tab-btn" id="registerTab" type="button">Register</button>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn-primary" id="loginBtn">Login</button>
            </form>
            
            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input type="text" id="registerName" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Create a password (min 6 characters)" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                
                <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
            </form>
            
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // ✅ FIXED Firebase Configuration - Correct Database URL
        const firebaseConfig = {
            apiKey: "AIzaSyA3PFNIhXjyRyVtDagpVACoGjFDMVkWPzo",
            authDomain: "expense-tracker-app-9f58b.firebaseapp.com",
            databaseURL: "https://expense-tracker-app-9f58b-default-rtdb.asia-southeast1.firebasedatabase.app", // ✅ FIXED!
            projectId: "expense-tracker-app-9f58b",
            storageBucket: "expense-tracker-app-9f58b.firebasestorage.app",
            messagingSenderId: "292372924041",
            appId: "1:292372924041:web:1464cf450ed215260fa858"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        console.log('✅ Firebase initialized successfully!');

        // Tab switching
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        loginTab.addEventListener('click', function() {
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
            clearError();
        });

        registerTab.addEventListener('click', function() {
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
            clearError();
        });

        // ✅ FIXED Register Handler
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('registerBtn');
            
            // Clear previous errors
            clearError();
            
            // Validation
            if (!name || !email || !password) {
                showError('❌ Please fill in all fields!');
                return;
            }

            if (name.length < 2) {
                showError('❌ Name must be at least 2 characters!');
                return;
            }

            if (password.length < 6) {
                showError('❌ Password must be at least 6 characters!');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('❌ Passwords do not match!');
                return;
            }
            
            // Disable button and show loading
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> Creating Account...';
            
            try {
                // Create user in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                console.log('✅ User created in Auth:', user.uid);
                
                // Update profile with name
                await updateProfile(user, { displayName: name });
                console.log('✅ Profile updated with name');
                
                // Save user data to Realtime Database
                await set(ref(database, 'users/' + user.uid), {
                    name: name,
                    email: email,
                    createdAt: new Date().toISOString()
                });
                console.log('✅ User saved to database');
                
                // Save to localStorage
                localStorage.setItem('currentUser', JSON.stringify({
                    uid: user.uid,
                    name: name,
                    email: email
                }));
                
                // Show success message
                showSuccess('✅ Account created successfully! Redirecting...');
                
                // Reset form
                document.getElementById('registerForm').reset();
                
                // Redirect after 1.5 seconds
                setTimeout(() => {
                    window.location.href = 'dash.html';
                }, 1500);
                
            } catch (error) {
                console.error('❌ Registration error:', error);
                
                let errorMessage = 'Registration failed! ';
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = '❌ Email already registered! Please login.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = '❌ Invalid email address!';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = '❌ Password is too weak!';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMessage = '❌ Network error. Check your internet connection.';
                } else {
                    errorMessage = '❌ ' + error.message;
                }
                
                showError(errorMessage);
                
                // Re-enable button
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            
            clearError();
            
            if (!email || !password) {
                showError('❌ Please enter email and password!');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> Logging in...';
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                localStorage.setItem('currentUser', JSON.stringify({
                    uid: user.uid,
                    name: user.displayName || 'User',
                    email: user.email
                }));
                
                console.log('✅ Login successful:', user.uid);
                showSuccess('✅ Login successful! Redirecting...');
                
                setTimeout(() => {
                    window.location.href = 'dash.html';
                }, 1500);
                
            } catch (error) {
                console.error('❌ Login error:', error);
                
                let errorMessage = 'Login failed! ';
                
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMessage = '❌ Invalid email or password!';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = '❌ Too many failed attempts. Try again later.';
                } else if (error.code === 'auth/network-request-failed') {
                    errorMessage = '❌ Network error. Check your internet connection.';
                } else {
                    errorMessage = '❌ ' + error.message;
                }
                
                showError(errorMessage);
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            errorDiv.style.background = '#fee2e2';
            errorDiv.style.color = '#ef4444';
            errorDiv.classList.add('show');
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            errorDiv.style.background = '#d1fae5';
            errorDiv.style.color = '#10b981';
            errorDiv.classList.add('show');
        }

        function clearError() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';
            errorDiv.classList.remove('show');
        }
    </script>
</body>
</html>
